name: CMake - macOS Universal Packages

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get short SHA
        id: git
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.2"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          modules: "qtserialport"
          archives: "qtbase qttools qttranslations qtsvg"
          cache: true

      - name: Show Tool Versions
        run: |
          cmake --version
          clang --version
          xcodebuild -version
          qmake -v
          macdeployqt -h | head -n 2

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOFAPP_GITHASH="${{ steps.git.outputs.sha }}" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Verify Universal Binary
        run: |
          echo "==== file ===="
          file build/OpenFIREapp.app/Contents/MacOS/OpenFIREapp

          echo ""
          echo "==== lipo ===="
          lipo -info build/OpenFIREapp.app/Contents/MacOS/OpenFIREapp

      - name: Install
        run: |
          cmake --install build --prefix build/out

      - name: Create Universal DMG
        run: |
          APP="build/out/OpenFIREapp.app"

          if [ ! -d "$APP" ]; then
            echo "Application bundle not found!"
            exit 1
          fi

          macdeployqt "$APP" -dmg

          DMG="build/out/OpenFIREapp.dmg"

          if [ ! -f "$DMG" ]; then
            echo "DMG was not created!"
            exit 1
          fi

          mv "$DMG" build/out/OpenFIREapp-macOS-Universal.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFIREapp-macOS-Universal
          path: build/out/OpenFIREapp-macOS-Universal.dmg