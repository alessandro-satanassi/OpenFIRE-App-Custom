name: CMake - macOS Universal Packages

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Get short SHA
      id: get-short-sha
      run: echo "id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'mac'
        arch: 'clang_64'
        modules: 'qtserialport'
        archives: 'qtbase qttranslations qttools qtsvg'
        cache: true

    - name: Configure CMake (Universal Binary)
      # Passiamo a CMake la flag per ignorare la richiesta del framework AGL mancante nell'SDK Apple
      run: >
        cmake -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE=Release
        -DOFAPP_GITHASH="${{ steps.get-short-sha.outputs.id }}"
        -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
        -DCMAKE_EXE_LINKER_FLAGS="-F/System/Library/Frameworks -Wl,-U,_AGL*"
        -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config Release --parallel

    - name: Deploy and Create Universal DMG
      run: |
        cmake --install "${{ github.workspace }}/build" --prefix "${{ github.workspace }}/build/out"
        APP_BUNDLE="${{ github.workspace }}/build/out/OpenFIREapp.app"
        if [ ! -d "$APP_BUNDLE" ]; then
          echo "App bundle non trovato!"
          exit 1
        fi
        # Genera direttamente il file .dmg universale nativo (Intel + Apple Silicon)
        macdeployqt "$APP_BUNDLE" -dmg
        
        # Rinomina il file dmg creato per chiarezza
        cd "${{ github.workspace }}/build/out"
        mv OpenFIREapp.dmg OpenFIREapp-macOS-Universal.dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: OpenFIREapp-macOS-Universal-Release
        path: build/out/OpenFIREapp-macOS-Universal.dmg

    - name: Download a Build Artifact
      uses: actions/download-artifact@v8
      with:
        name: OpenFIREapp-macOS-Universal-Release
        path: ${{ github.workspace }}/downloaded-artifact