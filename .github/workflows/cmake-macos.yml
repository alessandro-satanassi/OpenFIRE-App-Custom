name: CMake - macOS Universal Packages

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Get short SHA
        id: git
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.4"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          modules: "qtserialport"
          archives: "qtbase qttools qttranslations qtsvg"
          cache: true

      - name: Tool versions
        run: |
          cmake --version
          clang --version
          xcodebuild -version
          which qmake
          qmake -v
          which macdeployqt
          macdeployqt -h | head -n 2

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DOFAPP_GITHASH="${{ steps.git.outputs.sha }}" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          cmake --build build --parallel --verbose

      - name: Install
        run: |
          cmake --install build --prefix build/out

      - name: Show output
        run: |
          find build/out -maxdepth 3

      - name: Create DMG
        run: |
          APP="build/out/OpenFIREapp.app"

          if [ ! -d "$APP" ]; then
            echo "Bundle non trovato"
            exit 1
          fi

          macdeployqt "$APP" -dmg

          mv build/out/OpenFIREapp.dmg build/out/OpenFIREapp-macOS-Universal.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFIREapp-macOS-Universal
          path: build/out/OpenFIREapp-macOS-Universal.dmg